name: Update snapshot

on:
  workflow_dispatch:
  push:
    branches:
       - 'dependabot/**'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '>=24.22.1 <25'
          check-latest: true
      - name: Record Node.js runtime
        run: |
          node --version
          node -p 'process.execPath'
      - run: |
          npm ci
          npm run test -- -u
        working-directory: ./
      - name: Add & Commit
        uses: EndBug/add-and-commit@v7.2.0
        with:
          add: "test/__snapshots__/."
          message: "update snapshot"
