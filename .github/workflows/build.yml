permissions:
  contents: read
name: Build
on: 
  push:
    branches:
    - main
  workflow_dispatch:
  pull_request:
jobs:
  Build-and-Test-CDK:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '>=24.22.1 <25'
          check-latest: true
      - name: Record Node.js runtime
        run: |
          node --version
          node -p 'process.execPath'
      - run: |
          npm ci
          npm run build
          npm run format:check
        working-directory: ./
        name: static analysis
      - run: |
          npm run test
        working-directory: ./
        name: snaphost test
      - name: Synthesize with offline test context
        run: |
          node - <<'NODE'
          const fs = require('fs');
          fs.writeFileSync('cdk.context.json', JSON.stringify({
            'availability-zones:account=123456789012:region=us-west-2': ['us-west-2a', 'us-west-2b'],
          }));
          NODE
          npx cdk synth --lookups=false --app 'CDK_DEFAULT_ACCOUNT=123456789012 npx ts-node --prefer-ts-exts bin/cdk.ts'
